# Builds and publishes a release when a version tag is pushed.
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# The runner produces two artifacts:
#   * elite-hud-setup-<version>.exe  -- Inno Setup installer (the auto-updater
#     downloads this one for an installed copy)
#   * elite-hud-<version>-win64.zip  -- portable folder (used by a portable copy)
# plus SHA256SUMS.txt, which the in-app updater verifies before installing.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true
        type: string

# contents: write is what `gh release create` needs.
#
# Caveat: if the tagged commit touched .github/workflows/, GitHub refuses to
# authorise GITHUB_TOKEN for that release and the API answers 404. That cannot
# be fixed from inside the workflow -- re-run it from a commit that leaves the
# workflow files alone, or attach the assets by hand.
permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  release:
    runs-on: windows-latest
    # Generous for a PySide6 build and upload, but bounded: a hung step must not
    # occupy a runner for the default six hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Resolve the version and refuse tag/package mismatches
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $tagVersion = $tag.TrimStart('v')
          $match = Select-String -Path "elite_hud/__init__.py" -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $match) { Write-Error "cannot read __version__ from elite_hud/__init__.py"; exit 1 }
          $pkgVersion = $match.Matches[0].Groups[1].Value
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "tag '$tag' does not match __version__ '$pkgVersion' -- bump the version first"
            exit 1
          }
          "VERSION=$tagVersion"      >> $env:GITHUB_ENV
          "TAG=$tag"                 >> $env:GITHUB_ENV
          Write-Host "releasing elite-hud $tagVersion"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run the test suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m unittest discover -s tests -t . -v 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The same reporting as ci.yml: a failing test and its assertion text
            # become check annotations, which are readable without a token. This
            # step failed once and the only thing visible from outside was "exit
            # code 1", which is not enough to act on.
            grep -E '^(FAIL|ERROR): ' tests.log | sort -u | while IFS= read -r line; do
              echo "::error title=${line}::${line}"
            done
            grep -hE '^(AssertionError|.*Error|.*Exception|FAILED)' tests.log \
              | head -20 | while IFS= read -r line; do
              echo "::error title=failure detail::${line}"
            done
          fi
          exit $status

      - name: Generate the application icon
        run: python tools/make_icon.py

      - name: Build the executable
        run: python tools/build_exe.py --windowed

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup is not preinstalled; installing via Chocolatey"
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found"; exit 1 }
          "path=$iscc" >> $env:GITHUB_OUTPUT
          & $iscc /? | Select-Object -First 1

      - name: Build the installer
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.path }}" "/DAppVersion=$env:VERSION" "installer\elite-hud.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Package the portable build
        shell: pwsh
        run: |
          $zip = "dist\elite-hud-$env:VERSION-win64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "dist\elite-hud\*" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-Table Name, Length

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Smoke-test the frozen executable
        shell: pwsh
        run: |
          # The release build is a windowed (GUI subsystem) executable. PowerShell
          # does not wait for `& $exe` in that case and $LASTEXITCODE stays empty,
          # which is why this uses Start-Process -Wait and reads a real exit code.
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path "dist\elite-hud\elite-hud.exe").Path
          Write-Host "testing $exe"

          # Bounded: a windowed app that crashes shows an error dialog and never
          # exits, so -Wait would hang the runner until the job timeout.
          #
          # Every flag here must return on its own. --print-state and --headless
          # do not: they start the overlay and keep running until the commander
          # closes it, so listing them here reports a healthy build as hung.
          foreach ($arg in @("--version", "--self-check", "--make-config")) {
            $proc = Start-Process -FilePath $exe -ArgumentList $arg -PassThru -WindowStyle Hidden
            if (-not $proc.WaitForExit(60000)) {
              $proc.Kill()
              $proc.WaitForExit()
              Write-Error "the frozen build hung on '$arg' (killed after 60s); a windowed PyInstaller app that fails at startup shows a dialog and never exits"
              exit 1
            }
            if ($proc.ExitCode -ne 0) {
              Write-Error "the frozen build failed '$arg' with exit code $($proc.ExitCode)"
              exit 1
            }
            Write-Host "  $arg -> exit 0"
          }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            "dist\elite-hud-setup-$env:VERSION.exe",
            "dist\elite-hud-$env:VERSION-win64.zip",
            "dist\SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { Write-Error "missing release asset $asset"; exit 1 }
          }

          # Create the release empty, then attach the files one by one: passing
          # an array straight to a native command depends on splatting rules,
          # and a release that silently ends up with zero assets is worse than
          # a loud failure.
          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $env:TAG already exists; attaching assets"
          } else {
            # --verify-tag makes a mistyped tag fail loudly instead of creating one.
            gh release create $env:TAG `
              --title "elite-hud $env:VERSION" `
              --generate-notes `
              --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          foreach ($asset in $assets) {
            gh release upload $env:TAG $asset --clobber
            if ($LASTEXITCODE -ne 0) { Write-Error "uploading $asset failed"; exit $LASTEXITCODE }
          }

          # Fail the job if the release did not end up with all three files.
          $published = gh release view $env:TAG --json assets --jq '.assets | length'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([int]$published -lt 3) {
            Write-Error "release $env:TAG has $published assets, expected 3"
            exit 1
          }
          Write-Host "release $env:TAG published with $published assets"
          gh release view $env:TAG
